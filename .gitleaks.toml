title = "LLMStackMac gitleaks extensions"

[extend]
useDefault = true

[[allowlists]]
description = "Allow internal nginx upstream service:port references like auth:9091"
regexTarget = "match"
regexes = ['''\bauth:[0-9]{2,5}\b''']
paths = ['''config/reverse-proxy/nginx\.conf''']

[[allowlists]]
description = "Ignore local-only secret files that are already git-ignored"
paths = [
  '''\.env\.mac$''',
  '''config/auth/configuration\.local\.yml$''',
  '''config/tls/dev\.key$''',
  '''config/tls/dev\.crt$''',
]
