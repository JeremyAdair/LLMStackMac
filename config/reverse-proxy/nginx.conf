server {
  listen 80;
  server_name localhost 127.0.0.1;
  return 301 https://llmstack.lan$request_uri;
}

server {
  listen 80;
  server_name llmstack.lan flowise.llmstack.lan openhands.llmstack.lan grafana.llmstack.lan nodered.llmstack.lan openwebui.llmstack.lan forgejo.llmstack.lan;
  return 301 https://$host$request_uri;
}

# Resolve container DNS names at request time so optional services
# (for example openhands) do not break nginx startup.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
  listen 443 ssl;
  server_name localhost 127.0.0.1;

  ssl_certificate /etc/nginx/certs/dev.crt;
  ssl_certificate_key /etc/nginx/certs/dev.key;

  return 301 https://llmstack.lan$request_uri;
}

# Main domain: Landing + Authelia
server {
  listen 443 ssl;
  server_name llmstack.lan;

  ssl_certificate /etc/nginx/certs/dev.crt;
  ssl_certificate_key /etc/nginx/certs/dev.key;

  location /_static/ {
    alias /usr/share/nginx/html/llmstack-static/;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }

  location = /authelia {
    return 302 /authelia/;
  }

  location /authelia/ {
    proxy_set_header Accept-Encoding "";
    proxy_pass http://auth:9091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    sub_filter_once on;
    sub_filter_types text/html;
    sub_filter '</head>' '<link rel="stylesheet" href="/_static/authelia-custom.css?v=20260308-1"></head>';
  }

  location = /authelia/api/verify {
    internal;
    proxy_pass http://auth:9091/api/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location @authelia_redirect {
    return 302 https://llmstack.lan/authelia/?rd=$scheme://$host$request_uri;
  }

  # Compatibility: if a client lands on /grafana on the main domain,
  # send it to the Grafana subdomain root.
  location = /grafana {
    return 301 https://grafana.llmstack.lan/grafana/;
  }

  location ^~ /grafana/ {
    return 301 https://grafana.llmstack.lan/grafana/;
  }

  # Flowise handles its own app auth/session endpoints.
  # Bypass Authelia subrequest on API routes to avoid 408->500 on login.
  location ^~ /api/ {
    proxy_pass http://flowise:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Uri $request_uri;
  }

  location / {
    auth_request /authelia/api/verify;
    error_page 401 = @authelia_redirect;
    auth_request_set $target_url $scheme://$host$request_uri;
    proxy_pass http://landing:80/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Original-URL $target_url;
    proxy_set_header X-Forwarded-Uri $request_uri;
  }
}

# Open WebUI
server {
  listen 443 ssl;
  server_name openwebui.llmstack.lan;

  ssl_certificate /etc/nginx/certs/dev.crt;
  ssl_certificate_key /etc/nginx/certs/dev.key;

  # OpenWebUI enforces its own app sessions on API endpoints.
  # Bypass auth_request here to avoid intermittent 408->500 failures on chat creation.
  # Hardening: disable local password auth endpoints and require OIDC SSO flow.
  location = /api/v1/auths/signin { return 403; }
  location = /api/v1/auths/signup { return 403; }

  location ^~ /api/ {
    auth_request off;
    proxy_pass http://open-webui:8080;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Uri $request_uri;
  }

  location /ws/ {
    auth_request off;
    proxy_pass http://open-webui:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Uri $request_uri;
  }

  location / {
    auth_request off;
    proxy_pass http://open-webui:8080;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Uri $request_uri;
    sub_filter_types text/html;
    sub_filter '</head>' '<style>:root{--llmstack-banner-h:36px;}#llmstack-banner{position:fixed;top:0;left:0;right:0;z-index:9999;background:#101828;color:#fff;font:600 12px/1.4 Segoe UI,system-ui,sans-serif;padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.2);}#llmstack-banner a{color:#ffd37a;text-decoration:none;}body{padding-top:var(--llmstack-banner-h)!important;}</style><script>(function(){if(window.__llmstackBannerV3){return;}window.__llmstackBannerV3=true;function top0(cs){return cs.top==="0px"||cs.top==="0";}function score(el){var cs=getComputedStyle(el);var z=parseInt(cs.zIndex,10);if(Number.isNaN(z)){z=0;}var r=el.getBoundingClientRect();return (z*1000000)+(r.width*100)+r.height;}function pickHeader(){var best=null;document.querySelectorAll("body *").forEach(function(el){if(el.id==="llmstack-banner"||el.id==="splash-screen"){return;}var cs=getComputedStyle(el);if((cs.position!=="fixed"&&cs.position!=="sticky")||!top0(cs)){return;}var r=el.getBoundingClientRect();if(r.top>2||r.height<24||r.width<260){return;}if(!best||score(el)>score(best)){best=el;}});return best;}function apply(){var b=document.getElementById("llmstack-banner");if(!b){return;}var h=Math.max(32,Math.round(b.getBoundingClientRect().height||36));document.documentElement.style.setProperty("--llmstack-banner-h",h+"px");var splash=document.getElementById("splash-screen");if(splash){splash.style.top=h+"px";splash.style.height="calc(100% - "+h+"px)";}var prev=document.querySelector("[data-llmstack-shifted]");if(prev){prev.style.top="";prev.removeAttribute("data-llmstack-shifted");}var header=pickHeader();if(header){header.style.top=h+"px";header.setAttribute("data-llmstack-shifted","yes");}}window.addEventListener("load",apply);window.addEventListener("resize",apply);new MutationObserver(apply).observe(document.documentElement,{childList:true,subtree:true});setTimeout(apply,50);setTimeout(apply,300);})();</script></head>';
    sub_filter '<body data-sveltekit-preload-data="hover">' '<body data-sveltekit-preload-data="hover"><div id="llmstack-banner">LLMStack <span style="opacity:.7">·</span> <a href="https://llmstack.lan/">Back to LLM Stack</a></div>';
    sub_filter '<body>' '<body><div id="llmstack-banner">LLMStack <span style="opacity:.7">·</span> <a href="https://llmstack.lan/">Back to LLM Stack</a></div>';
    sub_filter_once on;
  }
}

