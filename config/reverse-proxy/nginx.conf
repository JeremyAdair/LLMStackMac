# Grafana
server {
  listen 443 ssl;
  server_name grafana.llmstack.lan;

  ssl_certificate /etc/nginx/certs/dev.crt;
  ssl_certificate_key /etc/nginx/certs/dev.key;

  location = /authelia/api/verify {
    internal;
    proxy_pass http://auth:9091/api/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location @authelia_redirect {
    return 302 https://llmstack.lan/authelia/?rd=$scheme://$host$request_uri;
  }

  location / {
    auth_request /authelia/api/verify;
    error_page 401 = @authelia_redirect;
    auth_request_set $target_url $scheme://$host$request_uri;
    # Pass authenticated identity from Authelia to Grafana auth proxy.
    auth_request_set $auth_user $upstream_http_remote_user;
    proxy_pass http://grafana:3000;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-WEBAUTH-USER $auth_user;
    proxy_set_header X-Original-URL $target_url;
    proxy_set_header X-Forwarded-Uri $request_uri;
    sub_filter_types text/html;
    sub_filter '</head>' '<style>body{padding-top:36px !important;}</style></head>';
    sub_filter '</body>' '<div id="llmstack-banner" style="position:fixed;top:0;left:0;right:0;z-index:9999;background:#101828;color:#fff;font:600 12px/1.4 Segoe UI,system-ui,sans-serif;padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.2)">LLMStack <span style="opacity:.7">Â·</span> <a href="https://llmstack.lan/" style="color:#ffd37a;text-decoration:none">Back to Landing</a></div></body>';
