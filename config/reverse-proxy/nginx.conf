server {
  listen 80;
  server_name localhost 127.0.0.1;
  return 301 https://llmstack.lan$request_uri;
}

server {
  listen 80;
  server_name llmstack.lan flowise.llmstack.lan openhands.llmstack.lan grafana.llmstack.lan nodered.llmstack.lan openwebui.llmstack.lan forgejo.llmstack.lan prometheus.llmstack.lan pgadmin.llmstack.lan redisinsight.llmstack.lan qdrant.llmstack.lan dns.llmstack.lan aider.llmstack.lan;
  return 301 https://$host$request_uri;
}

# Resolve container DNS names at request time so optional services
# (for example openhands) do not break nginx startup.
resolver 127.0.0.11 valid=30s ipv6=off;
server_tokens off;

# Baseline HTTPS security headers.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

server {
  listen 443 ssl;
  server_name localhost 127.0.0.1;

  ssl_certificate /etc/nginx/certs/dev.crt;
  ssl_certificate_key /etc/nginx/certs/dev.key;

  return 301 https://llmstack.lan$request_uri;
}

# Main domain: Landing + Authelia
server {
  listen 443 ssl;
  server_name llmstack.lan;

  ssl_certificate /etc/nginx/certs/dev.crt;
  ssl_certificate_key /etc/nginx/certs/dev.key;

  location = /_static/authelia-custom.css {
    alias /usr/share/nginx/html/llmstack-static/authelia-custom.css;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }

  location = /_static/openclaw-bootstrap.js {
    alias /usr/share/nginx/html/llmstack-static/openclaw-bootstrap.js;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }

  location = /_static/aider-bootstrap.js {
    alias /usr/share/nginx/html/llmstack-static/aider-bootstrap.js;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }

  location = /authelia {
    return 302 /authelia/;
  }

  location /authelia/ {
    proxy_set_header Accept-Encoding "";
    set $auth_upstream "auth:9091";
    proxy_pass http://$auth_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    sub_filter_once on;
    sub_filter_types text/html;
    sub_filter '</head>' '<link rel="stylesheet" href="/_static/authelia-custom.css?v=20260309-2"></head>';
  }

  location = /authelia/api/verify {
    internal;
    set $authelia_verify "auth:9091";
    proxy_pass http://$authelia_verify/api/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location @authelia_redirect {
    return 302 https://llmstack.lan/authelia/?rd=$scheme://$host$request_uri;
  }

  # Compatibility: if a client lands on /grafana on the main domain,
  # send it to the Grafana subdomain root.
  location = /grafana {
    return 301 https://grafana.llmstack.lan/grafana/;
  }

  location ^~ /grafana/ {
    return 301 https://grafana.llmstack.lan/grafana/;
  }

  # Flowise handles its own app auth/session endpoints.
  # Bypass Authelia subrequest on API routes to avoid 408->500 on login.
  location ^~ /api/ {
    set $flowise_upstream "flowise:3000";
    proxy_pass http://$flowise_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Uri $request_uri;
  }

  # Landing PDF dropzone API -> python-toolbox upload + watcher status.
  location ^~ /pdf-api/ {
    auth_request /authelia/api/verify;
    error_page 401 = @authelia_redirect;
    auth_request_set $target_url $scheme://$host$request_uri;
    set $python_upstream "python-toolbox:8000";
    proxy_pass http://$python_upstream/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Original-URL $target_url;
    proxy_set_header X-Forwarded-Uri $request_uri;
    client_max_body_size 200m;
  }

  location ^~ /console/ {
    auth_request /authelia/api/verify;
    error_page 401 = @authelia_redirect;
    auth_request_set $target_url $scheme://$host$request_uri;
    auth_request_set $auth_user $upstream_http_remote_user;
    set $console_upstream "host.docker.internal:7682";
    proxy_pass http://$console_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-WEBAUTH-USER $auth_user;
    proxy_set_header X-Original-URL $target_url;
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_buffering off;
  }

  # Serve landing static assets without auth subrequest so CSS/background
  # always load even when auth session state is in transition.
  location = /styles.css {
    set $landing_upstream "landing:80";
    proxy_pass http://$landing_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 5m;
  }

  location ^~ /assets/Landing/ {
    alias /usr/share/nginx/html/llmstack-assets/Landing/;
    expires 5m;
  }

  location = /landing-bg-v2.png {
    set $landing_upstream "landing:80";
    proxy_pass http://$landing_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 5m;
  }

  location = /landing-bg.png {
    set $landing_upstream "landing:80";
    proxy_pass http://$landing_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 5m;
  }

  location ~* ^/(styles\.css|landing-bg.*\.(png|jpg|jpeg|webp|gif|svg)|favicon\.ico)$ {
    set $landing_upstream "landing:80";
    proxy_pass http://$landing_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 5m;
  }

  location / {
    auth_request /authelia/api/verify;
    error_page 401 = @authelia_redirect;
    auth_request_set $target_url $scheme://$host$request_uri;
    set $landing_upstream "landing:80";
    proxy_pass http://$landing_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Original-URL $target_url;
    proxy_set_header X-Forwarded-Uri $request_uri;
  }
}

# Open WebUI
server {
  listen 443 ssl;
  server_name openwebui.llmstack.lan;

  ssl_certificate /etc/nginx/certs/dev.crt;
  ssl_certificate_key /etc/nginx/certs/dev.key;

  # OpenWebUI enforces its own app sessions on API endpoints.
  # Bypass auth_request here to avoid intermittent 408->500 failures on chat creation.
  # Hardening: disable local password auth endpoints and require OIDC SSO flow.
  location = /api/v1/auths/signin { return 403; }
  location = /api/v1/auths/signup { return 403; }

  location ^~ /api/ {
    auth_request off;
    set $openwebui_upstream "open-webui:8080";
    proxy_pass http://$openwebui_upstream$request_uri;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Uri $request_uri;
  }

  location /ws/ {
    auth_request off;
    set $openwebui_upstream "open-webui:8080";
    proxy_pass http://$openwebui_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Uri $request_uri;
  }

  location / {
    auth_request off;
    set $openwebui_upstream "open-webui:8080";
    proxy_pass http://$openwebui_upstream$request_uri;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Uri $request_uri;
    sub_filter_types text/html;
    sub_filter '</head>' '<style>#llmstack-banner{position:sticky;top:0;z-index:9999;background:#101828;color:#fff;font:600 12px/1.4 Segoe UI,system-ui,sans-serif;padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.2);}#llmstack-banner a{color:#ffd37a;text-decoration:none;}</style></head>';
    sub_filter '<body data-sveltekit-preload-data="hover">' '<body data-sveltekit-preload-data="hover"><div id="llmstack-banner">LLMStack <span style="opacity:.7">·</span> <a href="https://llmstack.lan/">Back to LLM Stack</a></div>';
    sub_filter '<body>' '<body><div id="llmstack-banner">LLMStack <span style="opacity:.7">·</span> <a href="https://llmstack.lan/">Back to LLM Stack</a></div>';
    sub_filter_once on;
  }
}

# Forgejo
server {
  listen 443 ssl;
  server_name forgejo.llmstack.lan;

  ssl_certificate /etc/nginx/certs/dev.crt;
  ssl_certificate_key /etc/nginx/certs/dev.key;

  location /_static/ {
    alias /usr/share/nginx/html/llmstack-static/;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }

  location = /authelia/api/verify {
    internal;
    set $authelia_verify "auth:9091";
    proxy_pass http://$authelia_verify/api/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location @authelia_redirect {
    return 302 https://llmstack.lan/authelia/?rd=$scheme://$host$request_uri;
  }

  # Force SSO-only flow: never show Forgejo local sign-in/register pages.
  location ~ ^/user/(login|sign_up) {
    return 302 https://llmstack.lan/authelia/?rd=https://forgejo.llmstack.lan/llmstack/LLMStackMac;
  }

  # Land directly on the shared repository page.
  location = / {
    return 302 /llmstack/LLMStackMac;
  }

  location / {
    auth_request /authelia/api/verify;
    error_page 401 = @authelia_redirect;
    auth_request_set $target_url $scheme://$host$request_uri;
    auth_request_set $auth_user $upstream_http_remote_user;
    set $forgejo_upstream "forgejo:3000";
    proxy_pass http://$forgejo_upstream$request_uri;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-WEBAUTH-USER $auth_user;
    proxy_set_header Remote-User $auth_user;
    proxy_set_header X-Original-URL $target_url;
    proxy_set_header X-Forwarded-Uri $request_uri;
    sub_filter_types text/html;
    sub_filter '</head>' '<style>body{padding-top:36px !important;}</style></head>';
    sub_filter '</body>' '<div id="llmstack-banner" style="position:fixed;top:0;left:0;right:0;z-index:9999;background:#101828;color:#fff;font:600 12px/1.4 Segoe UI,system-ui,sans-serif;padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.2)">LLMStack <span style="opacity:.7">|</span> <a href="https://llmstack.lan/" style="color:#ffd37a;text-decoration:none">Back to LLM Stack</a></div></body>';
    sub_filter_once on;
  }
}

