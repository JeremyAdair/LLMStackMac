# Authelia configuration

server:
  address: tcp://0.0.0.0:9091/authelia

log:
  level: info

identity_validation:
  reset_password:
    # Overridden in compose via AUTHELIA_JWT_SECRET.
    jwt_secret: "change-me"

session:
  name: authelia_session
  # Overridden in compose via AUTHELIA_SESSION_SECRET.
  secret: "change-me"
  expiration: 3600
  inactivity: 300
  cookies:
    - domain: "llmstack.lan"
      authelia_url: "https://llmstack.lan/authelia"
      default_redirection_url: "https://llmstack.lan/"

storage:
  # Overridden in compose via AUTHELIA_STORAGE_ENCRYPTION_KEY.
  encryption_key: "change-me-change-me-change-me-change-me"
  postgres:
    # Overridden in compose via AUTHELIA_STORAGE_POSTGRES_*.
    address: "tcp://postgres:5432"
    database: "llmstack"
    schema: "public"
    username: "llmstack"
    password: "change-me"

authentication_backend:
  file:
    path: /config/users_database.yml

access_control:
  default_policy: deny
  rules:
    - domain: "*.llmstack.lan"
      policy: one_factor
      resources:
        - "^/api/verify$"
        - "^/flowise/.*$"
        - "^/openhands/.*$"
        - "^/grafana/.*$"
        - "^/nodered/.*$"
        - "^/$"
    - domain: "llmstack.lan"
      policy: one_factor
      resources:
        - "^/.*$"

regulation:
  max_retries: 5
  find_time: 120
  ban_time: 300

notifier:
  filesystem:
    filename: /data/notification.txt
