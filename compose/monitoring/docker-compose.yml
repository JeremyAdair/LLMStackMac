services:
  prometheus:
    image: prom/prometheus@sha256:4a61322ac1103a0e3aea2a61ef1718422a48fa046441f299d71e660a3bc71ae9
    restart: unless-stopped
    expose:
      - "9090"
    volumes:
      # Host-managed Prometheus config.
      - ${PROMETHEUS_CONFIG_MOUNT:-./compose/monitoring/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      # Persist Prometheus TSDB metrics data.
      - ${PROMETHEUS_DATA_MOUNT:-prometheus_data}:/prometheus
    networks:
      - llm-stack

  grafana:
    image: grafana/grafana@sha256:b0ae311af06228bcfd4a620504b653db80f5b91e94dc3dc2a5b7dab202bcde20
    restart: unless-stopped
    # Internal-only access through the reverse proxy.
    expose:
      - "3000"
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # SSO via Authelia-forwarded identity header from reverse-proxy.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Optional comma-separated plugin list, for example:
      # GRAFANA_INSTALL_PLUGINS=grafana-clock-panel
      GF_INSTALL_PLUGINS: ${GRAFANA_INSTALL_PLUGINS:-}
    volumes:
      # Persist Grafana database/dashboards/settings.
      - ${GRAFANA_DATA_MOUNT:-grafana_data}:/var/lib/grafana
      # Optional provisioning from host (datasources/dashboards).
      - ${GRAFANA_PROVISIONING_MOUNT:-./config/grafana/provisioning}:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - llm-stack
