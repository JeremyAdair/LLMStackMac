############################################
# SECTION: File Overview
#
# What this part of the program does:
# Defines infrastructure settings for this part of the stack using Docker Compose YAML.
# It describes services, configuration, and how containers communicate.
#
# Why it exists:
# Keeping service definitions in versioned YAML makes local environments reproducible.
# This prevents manual setup drift and reduces onboarding errors for new users.
#
# What happens next:
# The sections below declare concrete service/runtime settings that Docker Compose
# reads to start, connect, and persist the containers for this component.
############################################

############################################
# SECTION: Service Catalog
#
# What this part of the program does:
# Lists all containerized services defined in this compose file.
#
# Why it exists:
# Compose reads this section to know which containers to create and run
# as part of this stack component.
#
# What happens next:
# Each service block below declares image/runtime settings, then optional
# network and storage sections connect services together.
############################################

services:

  ############################################
  # SECTION: Service - prometheus
  #
  # What this part of the program does:
  # Defines runtime settings for the "prometheus" container.
  #
  # Why it exists:
  # This service provides one concrete capability needed by the stack
  # (for example API, storage, UI, proxy, or worker behavior).
  #
  # What happens next:
  # The nested keys configure how this container starts, connects, and
  # persists data relative to other services.
  ############################################
  prometheus:
    image: prom/prometheus@sha256:4a61322ac1103a0e3aea2a61ef1718422a48fa046441f299d71e660a3bc71ae9
    restart: unless-stopped
    expose:
      - "9090"
    volumes:
      # Host-managed Prometheus config.
      - ${PROMETHEUS_CONFIG_MOUNT:-./compose/monitoring/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      # Persist Prometheus TSDB metrics data.
      - ${PROMETHEUS_DATA_MOUNT:-prometheus_data}:/prometheus
    networks:
      - llm-stack


  ############################################
  # SECTION: Service - grafana
  #
  # What this part of the program does:
  # Defines runtime settings for the "grafana" container.
  #
  # Why it exists:
  # This service provides one concrete capability needed by the stack
  # (for example API, storage, UI, proxy, or worker behavior).
  #
  # What happens next:
  # The nested keys configure how this container starts, connects, and
  # persists data relative to other services.
  ############################################
  grafana:
    image: grafana/grafana@sha256:b0ae311af06228bcfd4a620504b653db80f5b91e94dc3dc2a5b7dab202bcde20
    restart: unless-stopped
    # Internal-only access through the reverse proxy.
    expose:
      - "3000"
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # SSO via Authelia-forwarded identity header from reverse-proxy.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Optional comma-separated plugin list, for example:
      # GRAFANA_INSTALL_PLUGINS=grafana-clock-panel
      GF_INSTALL_PLUGINS: ${GRAFANA_INSTALL_PLUGINS:-}
    volumes:
      # Persist Grafana database/dashboards/settings.
      - ${GRAFANA_DATA_MOUNT:-grafana_data}:/var/lib/grafana
      # Optional provisioning from host (datasources/dashboards).
      - ${GRAFANA_PROVISIONING_MOUNT:-./config/grafana/provisioning}:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - llm-stack
