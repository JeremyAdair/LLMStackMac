groups:
  - name: llmstack-observability
    rules:
      - alert: HostCPUHigh
        expr: (100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Host CPU above 90%"
          description: "CPU usage has been above 90% for 5 minutes."

      - alert: HostDiskUsageHigh
        expr: 100 * (1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"})) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Root disk usage above 85%"
          description: "Root filesystem usage is above 85% for 10 minutes."

      - alert: ContainerRestartLoop
        expr: sum(changes(container_start_time_seconds{id=~"/docker/.+"}[10m])) > 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Container restart loop detected"
          description: "More than 3 container start-time changes were detected in 10 minutes."

      - alert: PostgreSQLDown
        expr: max(pg_up) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL exporter reports down"
          description: "postgres_exporter cannot connect to PostgreSQL."

      - alert: PrometheusScrapeFailures
        expr: up == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus target scrape failure"
          description: "Prometheus failed to scrape one or more targets for 3 minutes."

      - alert: OpenWebUIDown
        expr: probe_success{job="service_health",instance="http://open-webui:8080/"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Open WebUI probe failing"
          description: "Blackbox probe to Open WebUI is failing."

      - alert: OllamaDown
        expr: probe_success{job="service_health",instance="http://ollama:11434/api/tags"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Ollama probe failing"
          description: "Blackbox probe to Ollama is failing."
