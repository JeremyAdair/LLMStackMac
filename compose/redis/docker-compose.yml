services:
  redis:
    image: redis@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065
    command: ["redis-server", "--appendonly", "yes"]
    # Expose for local debugging; internal services use the network name.
    ports:
      # Change the host port if 6379 is in use.
      - "6379:6379"
    volumes:
      # Persist Redis AOF/RDB state on host.
      # For macOS, set REDIS_DATA_MOUNT=redis_data in env overrides.
      - ${REDIS_DATA_MOUNT:-${LLMSTACK_HOST_ROOT:-C:/llm-stack}/redis/data}:/data
    networks:
      - llm-stack
    healthcheck:
      # Basic ping check to confirm Redis is up.
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
