services:
  redis:
    image: redis@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065
    command: ["redis-server", "--appendonly", "yes"]
    # Internal-only access; use the service name from other containers.
    expose:
      - "6379"
    volumes:
      # Persist Redis AOF/RDB state.
      - ${REDIS_DATA_MOUNT:-redis_data}:/data
    networks:
      - llm-stack
    healthcheck:
      # Basic ping check to confirm Redis is up.
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
