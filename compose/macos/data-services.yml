services:
  postgres:
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    restart: unless-stopped
    volumes:
      - redis_data:/data

  redisinsight:
    restart: unless-stopped
    volumes:
      - redisinsight_data:/data

  qdrant:
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
