services:
  pgadmin:
    image: dpage/pgadmin4@sha256:d243a4bcc02d2ee6b447c601692813531d2d0fbca18b583d9f7f9658da835d81
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?set PGADMIN_DEFAULT_EMAIL in your env file}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD in your env file}
      # SSO via reverse proxy authenticated identity header.
      PGADMIN_CONFIG_AUTHENTICATION_SOURCES: "['webserver']"
      PGADMIN_CONFIG_WEBSERVER_REMOTE_USER: "'HTTP_X_FORWARDED_USER'"
      PGADMIN_CONFIG_WEBSERVER_AUTO_CREATE_USER: "True"
      # Keep pgAdmin data encrypted at rest with a per-user master password.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    expose:
      - "80"
    volumes:
      # Use a Docker volume because pgAdmin needs chmod/chown on SQLite files.
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - llm-stack
