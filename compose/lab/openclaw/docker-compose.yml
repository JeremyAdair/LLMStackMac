############################################
# SECTION: File Overview
#
# What this part of the program does:
# Defines infrastructure settings for this part of the stack using Docker Compose YAML.
# It describes services, configuration, and how containers communicate.
#
# Why it exists:
# Keeping service definitions in versioned YAML makes local environments reproducible.
# This prevents manual setup drift and reduces onboarding errors for new users.
#
# What happens next:
# The sections below declare concrete service/runtime settings that Docker Compose
# reads to start, connect, and persist the containers for this component.
############################################

############################################
# SECTION: Service Catalog
#
# What this part of the program does:
# Lists all containerized services defined in this compose file.
#
# Why it exists:
# Compose reads this section to know which containers to create and run
# as part of this stack component.
#
# What happens next:
# Each service block below declares image/runtime settings, then optional
# network and storage sections connect services together.
############################################

services:

  ############################################
  # SECTION: Service - openclaw
  #
  # What this part of the program does:
  # Defines runtime settings for the "openclaw" container.
  #
  # Why it exists:
  # This service provides one concrete capability needed by the stack
  # (for example API, storage, UI, proxy, or worker behavior).
  #
  # What happens next:
  # The nested keys configure how this container starts, connects, and
  # persists data relative to other services.
  ############################################
  openclaw:
    profiles:
      - lab
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.3.11}
    user: "0:0"
    # Seed runtime config into volume on first boot, then start gateway.
    command:
      - /bin/sh
      - -lc
      - |
        token_escaped="$(printf '%s' "${OPENCLAW_GATEWAY_TOKEN}" | sed 's/[\/&]/\\&/g')"
        sed "s/__OPENCLAW_GATEWAY_TOKEN__/$${token_escaped}/g" /config/openclaw.json > /data/openclaw.json
        chmod 600 /data/openclaw.json
        mkdir -p /data/workspace-chat /data/workspace-main
        rm -rf /data/workspace-chat/.git /data/workspace-main/.git
        cp -Rn /config/workspace-chat/. /data/workspace-chat/
        cp -Rn /config/workspace-main/. /data/workspace-main/
        exec node dist/index.js gateway
    environment:
      # Use volume-backed runtime config (tokens/secrets never written to git files).
      OPENCLAW_CONFIG_PATH: /data/openclaw.json
      # Persist runtime state (auth token, logs, caches) across restarts.
      OPENCLAW_STATE_DIR: /data
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN in your env file}
    volumes:
      - ../config/openclaw/openclaw.json:/config/openclaw.json:ro
      - ../config/openclaw/workspace-chat:/config/workspace-chat:ro
      - ../config/openclaw/workspace-main:/config/workspace-main:ro
      - ${OPENCLAW_STATE_MOUNT:-openclaw_data}:/data
    networks:
      - llm-stack
      - ollama-access
    expose:
      # Internal-only port; reverse proxy publishes it.
      - "18789"

networks:
  ollama-access:
    external: true
    name: llm-ollama-access
