############################################
# SECTION: File Overview
#
# What this part of the program does:
# Defines infrastructure settings for this part of the stack using Docker Compose YAML.
# It describes services, configuration, and how containers communicate.
#
# Why it exists:
# Keeping service definitions in versioned YAML makes local environments reproducible.
# This prevents manual setup drift and reduces onboarding errors for new users.
#
# What happens next:
# The sections below declare concrete service/runtime settings that Docker Compose
# reads to start, connect, and persist the containers for this component.
############################################

############################################
# SECTION: Service Catalog
#
# What this part of the program does:
# Lists all containerized services defined in this compose file.
#
# Why it exists:
# Compose reads this section to know which containers to create and run
# as part of this stack component.
#
# What happens next:
# Each service block below declares image/runtime settings, then optional
# network and storage sections connect services together.
############################################

services:

  ############################################
  # SECTION: Service - openhands
  #
  # What this part of the program does:
  # Defines runtime settings for the "openhands" container.
  #
  # Why it exists:
  # This service provides one concrete capability needed by the stack
  # (for example API, storage, UI, proxy, or worker behavior).
  #
  # What happens next:
  # The nested keys configure how this container starts, connects, and
  # persists data relative to other services.
  ############################################
  openhands:
    profiles:
      - lab
    image: ${OPENHANDS_IMAGE:-docker.all-hands.dev/all-hands-ai/openhands:0.54}
    environment:
      # Serve OpenHands under a path on the reverse proxy.
      OPENHANDS_BASE_PATH: ${OPENHANDS_BASE_PATH:-/openhands}
      # Sandbox runtime image used for agent sessions.
      SANDBOX_RUNTIME_CONTAINER_IMAGE: ${OPENHANDS_RUNTIME_IMAGE:-docker.all-hands.dev/all-hands-ai/runtime:0.54-nikolaik}
      # Recommended runtime mount configuration for sandbox containers.
      SANDBOX_VOLUMES: ${OPENHANDS_SANDBOX_VOLUMES:-${OPENHANDS_REPOS_MOUNT:-../data/openhands-workspace}:/workspace:rw}
      # Attach sandbox sessions to the shared stack network for forgejo/ollama DNS access.
      SANDBOX_ADDITIONAL_NETWORKS: ${OPENHANDS_SANDBOX_NETWORKS:-["llm-stack_llm-stack"]}
      # Persist OpenHands state inside mounted storage.
      OH_PERSISTENCE_DIR: /.openhands
      # Optional model backend configuration.
      LLM_MODEL: ${OPENHANDS_LLM_MODEL:-}
      LLM_BASE_URL: ${OPENHANDS_LLM_BASE_URL:-}
      LLM_API_KEY: ${OPENHANDS_LLM_API_KEY:-}
      # Repo defaults and git identity for agent sessions.
      FORGEJO_BASE_URL: ${FORGEJO_BASE_URL:-http://forgejo:3000}
      FORGEJO_OWNER: ${FORGEJO_OWNER:-}
      FORGEJO_REPO: ${FORGEJO_REPO:-}
      FORGEJO_TOKEN: ${FORGEJO_TOKEN:-}
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
    volumes:
      # Docker socket is required for OpenHands runtime containers.
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist OpenHands state and session metadata.
      - ${OPENHANDS_STATE_MOUNT:-openhands_data}:/.openhands
      # Host-visible workspace for repositories and edits.
      - ${OPENHANDS_REPOS_MOUNT:-../data/openhands-workspace}:/workspace
    networks:
      - llm-stack
    expose:
      # Internal-only port; reverse proxy publishes it.
      - "3000"
