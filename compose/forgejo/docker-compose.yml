services:
  forgejo:
    image: codeberg.org/forgejo/forgejo@sha256:ea792343484a45f387b05540874aa0836fd0c251522f94d488f1df65faa1763e
    environment:
      USER_UID: ${FORGEJO_UID:-1000}
      USER_GID: ${FORGEJO_GID:-1000}
      FORGEJO__server__DOMAIN: ${FORGEJO_DOMAIN:-forgejo.llmstack.lan}
      FORGEJO__server__ROOT_URL: ${FORGEJO_ROOT_URL:-https://forgejo.llmstack.lan/}
      FORGEJO__server__PROTOCOL: http
      FORGEJO__server__HTTP_PORT: 3000
      FORGEJO__server__SSH_DOMAIN: ${FORGEJO_SSH_DOMAIN:-forgejo.llmstack.lan}
      FORGEJO__server__SSH_PORT: 2222
      # SSO via Authelia-forwarded identity header from reverse-proxy.
      FORGEJO__service__ENABLE_REVERSE_PROXY_AUTHENTICATION: "true"
      FORGEJO__service__ENABLE_REVERSE_PROXY_AUTO_REGISTRATION: "true"
      FORGEJO__service__REVERSE_PROXY_AUTHENTICATION_USER: X-WEBAUTH-USER
      FORGEJO__security__REVERSE_PROXY_LIMIT: "1"
      FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES: "*"
    volumes:
      # Persist repos, users, issues, and Forgejo config.
      - ${FORGEJO_DATA_MOUNT:-forgejo_data}:/data
    expose:
      # Web UI stays internal behind reverse proxy + Authelia.
      - "3000"
    ports:
      # SSH for git operations. Change the host port if 2222 is in use.
      - "2222:22"
    networks:
      - llm-stack
