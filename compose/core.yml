services:
  ollama-gateway:
    image: nginx@sha256:1d13701a5f9f3fb01aaa88cef2344d65b6b5bf6b7d9fa4cf0dca557a8d7702ba
    environment:
      OLLAMA_UPSTREAM_URL: ${OLLAMA_UPSTREAM_URL:-http://host.docker.internal:11434}
    volumes:
      - ../config/ollama-gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      ollama-access:
        aliases:
          - ollama-gateway
    expose:
      - "11434"
    restart: unless-stopped

  auth:
    image: authelia/authelia@sha256:d23ee3c721d465b4749cc58541cda4aebe5aa6f19d7b5ce0afebb44ebee69591
    command: >
      /bin/sh -c '
      if [ -f /config/configuration.local.yml ]; then
        exec authelia --config /config/configuration.yml --config /config/configuration.local.yml;
      else
        exec authelia --config /config/configuration.yml;
      fi'
    volumes:
      - ../config/auth:/config
      - ../data/auth:/data
    environment:
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_STORAGE_POSTGRES_ADDRESS: ${AUTHELIA_STORAGE_POSTGRES_ADDRESS:-tcp://postgres:5432}
      AUTHELIA_STORAGE_POSTGRES_DATABASE: ${POSTGRES_DB}
      AUTHELIA_STORAGE_POSTGRES_SCHEMA: ${AUTHELIA_STORAGE_POSTGRES_SCHEMA:-public}
      AUTHELIA_STORAGE_POSTGRES_USERNAME: ${POSTGRES_USER}
      AUTHELIA_STORAGE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
      LANDING_HOSTNAME: ${LANDING_HOSTNAME}
    networks:
      llm-stack:
        aliases:
          - auth
    expose:
      - "9091"
    restart: unless-stopped

  open-webui:
    image: openwebui/open-webui@sha256:b80a96e14bb15ea79aec96fbdad4aeab6b3ee7b61520d83b5dbc8c4f47d433a9
    expose:
      - "8080"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama-gateway:11434}
      DATABASE_URL: ${OPENWEBUI_DATABASE_URL:?set OPENWEBUI_DATABASE_URL in your env file}
      ENABLE_SIGNUP: "false"
      ENABLE_LOGIN_FORM: ${OPENWEBUI_ENABLE_LOGIN_FORM:-false}
      ENABLE_OAUTH_SIGNUP: ${OPENWEBUI_ENABLE_OAUTH_SIGNUP:-true}
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: ${OPENWEBUI_OAUTH_MERGE_ACCOUNTS_BY_EMAIL:-true}
      WEBUI_URL: ${OPENWEBUI_WEBUI_URL:-https://openwebui.llmstack.lan}
      OAUTH_CLIENT_ID: ${OPENWEBUI_OAUTH_CLIENT_ID:-open-webui}
      OAUTH_CLIENT_SECRET: ${OPENWEBUI_OAUTH_CLIENT_SECRET:?set OPENWEBUI_OAUTH_CLIENT_SECRET in your env file}
      OPENID_PROVIDER_URL: ${OPENWEBUI_OPENID_PROVIDER_URL:-https://llmstack.lan/authelia/.well-known/openid-configuration}
      OPENID_REDIRECT_URI: ${OPENWEBUI_OPENID_REDIRECT_URI:-https://openwebui.llmstack.lan/oauth/oidc/callback}
      OAUTH_PROVIDER_NAME: ${OPENWEBUI_OAUTH_PROVIDER_NAME:-Authelia}
      OAUTH_SCOPES: ${OPENWEBUI_OAUTH_SCOPES:-openid email profile}
      OAUTH_CODE_CHALLENGE_METHOD: ${OPENWEBUI_OAUTH_CODE_CHALLENGE_METHOD:-S256}
      SSL_CERT_FILE: /etc/ssl/certs/llmstack-dev.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/llmstack-dev.crt
      CURL_CA_BUNDLE: /etc/ssl/certs/llmstack-dev.crt
    volumes:
      - ${OPENWEBUI_DATA_MOUNT:-openwebui_data}:/app/backend/data
      - ../config/tls/dev.crt:/etc/ssl/certs/llmstack-dev.crt:ro
    networks:
      llm-stack:
        aliases:
          - open-webui
      ollama-access:
    restart: unless-stopped

  flowise:
    image: flowiseai/flowise@sha256:c8aa4b4cb910a7b1aa56c4eb30cd41a67002400d84b1289f09c0a6b276b416c3
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama-gateway:11434}
      FLOWISE_USERNAME: ${FLOWISE_USERNAME:-}
      FLOWISE_PASSWORD: ${FLOWISE_PASSWORD:-}
      FLOWISE_BASE_PATH: ${FLOWISE_BASE_PATH:-/}
    volumes:
      - ${FLOWISE_DATA_MOUNT:-flowise_data}:/root/.flowise
      - ${PDF_DROP_MOUNT:-../data/pdfs}:/data/pdfs
    networks:
      llm-stack:
        aliases:
          - flowise
      ollama-access:
    expose:
      - "3000"
    restart: unless-stopped

  landing:
    image: nginx@sha256:1d13701a5f9f3fb01aaa88cef2344d65b6b5bf6b7d9fa4cf0dca557a8d7702ba
    volumes:
      - ../config/landing:/usr/share/nginx/html:ro
    networks:
      llm-stack:
        aliases:
          - landing
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  reverse-proxy:
    image: nginx@sha256:1d13701a5f9f3fb01aaa88cef2344d65b6b5bf6b7d9fa4cf0dca557a8d7702ba
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:80:80"
      - "${HOST_BIND_IP:-127.0.0.1}:443:443"
    volumes:
      - ../config/reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../config/tls:/etc/nginx/certs:ro
      - ../config/reverse-proxy/static:/usr/share/nginx/html/llmstack-static:ro
      - ../assets:/usr/share/nginx/html/llmstack-assets:ro
    depends_on:
      - open-webui
      - flowise
      - auth
      - landing
    networks:
      llm-stack:
        aliases:
          - llmstack.lan
    restart: unless-stopped

networks:
  llm-stack:
    name: llm-shared
    external: true
  ollama-access:
    name: llm-ollama-access
    external: true

volumes:
  openwebui_data:
    name: llm-stack_openwebui_data
    external: true
  flowise_data:
    name: llm-stack_flowise_data
    external: true
