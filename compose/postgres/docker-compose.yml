services:
  postgres:
    image: postgres@sha256:fceb6f86328c36f2438fae3b851b0cc57c4a7e69a58c866d9ce24281f2cf0c9c
    # Internal-only access; use the service name from other containers.
    expose:
      - "5432"
    environment:
      # Require explicit credentials from env file.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in your env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your env file}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in your env file}
      # Strong auth defaults for new database initialization.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      # Persist PostgreSQL database files.
      - ${POSTGRES_DATA_MOUNT:-postgres_data}:/var/lib/postgresql/data
    networks:
      - llm-stack
    healthcheck:
      # Simple readiness probe for Docker Compose.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llmstack}"]
      interval: 10s
      timeout: 5s
      retries: 5
