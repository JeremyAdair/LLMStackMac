services:
  postgres:
    image: postgres@sha256:fceb6f86328c36f2438fae3b851b0cc57c4a7e69a58c866d9ce24281f2cf0c9c
    # Expose for local admin tools; internal services use the network name.
    ports:
      # Change the host port if 5432 is in use.
      - "5432:5432"
    environment:
      # Default credentials come from .env.
      POSTGRES_USER: ${POSTGRES_USER:-llmstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmstack}
      POSTGRES_DB: ${POSTGRES_DB:-llmstack}
    volumes:
      # Persist PostgreSQL database files on host.
      # For macOS, set POSTGRES_DATA_MOUNT=postgres_data in env overrides.
      - ${POSTGRES_DATA_MOUNT:-${LLMSTACK_HOST_ROOT:-C:/llm-stack}/postgres/data}:/var/lib/postgresql/data
    networks:
      - llm-stack
    healthcheck:
      # Simple readiness probe for Docker Compose.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llmstack}"]
      interval: 10s
      timeout: 5s
      retries: 5
