services:
  prometheus:
    image: prom/prometheus@sha256:4a61322ac1103a0e3aea2a61ef1718422a48fa046441f299d71e660a3bc71ae9
    expose:
      - "9090"
    volumes:
      - ${PROMETHEUS_CONFIG_MOUNT:-./observability/monitoring/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ${PROMETHEUS_ALERT_RULES_MOUNT:-./observability/monitoring/alerts.yml}:/etc/prometheus/alerts.yml:ro
      - ${PROMETHEUS_DATA_MOUNT:-prometheus_data}:/prometheus
    networks:
      llm-stack:
        aliases:
          - prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana@sha256:b0ae311af06228bcfd4a620504b653db80f5b91e94dc3dc2a5b7dab202bcde20
    expose:
      - "3000"
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: ${GRAFANA_DEFAULT_HOME_DASHBOARD_PATH:-/etc/grafana/dashboards/host-overview.json}
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_INSTALL_PLUGINS: ${GRAFANA_INSTALL_PLUGINS:-}
    volumes:
      - ${GRAFANA_DATA_MOUNT:-grafana_data}:/var/lib/grafana
      - ${GRAFANA_PROVISIONING_MOUNT:-../config/grafana/provisioning}:/etc/grafana/provisioning:ro
      - ${GRAFANA_DASHBOARDS_MOUNT:-../config/grafana/dashboards}:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      llm-stack:
        aliases:
          - grafana
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    expose:
      - "9100"
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|pstore|securityfs|squashfs|sysfs|tracefs)$
    volumes:
      - /:/host:ro
    networks:
      - llm-stack
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    expose:
      - "8080"
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - llm-stack
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    expose:
      - "9187"
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:?set POSTGRES_USER in your env file}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your env file}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in your env file}?sslmode=disable
    networks:
      - llm-stack
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    expose:
      - "9115"
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ${BLACKBOX_CONFIG_MOUNT:-./observability/monitoring/blackbox.yml}:/etc/blackbox_exporter/config.yml:ro
    networks:
      - llm-stack
    restart: unless-stopped

networks:
  llm-stack:
    name: llm-shared
    external: true

volumes:
  prometheus_data:
    name: llm-stack_prometheus_data
    external: true
  grafana_data:
    name: llm-stack_grafana_data
    external: true
