services:
  flowise:
    image: flowiseai/flowise@sha256:c8aa4b4cb910a7b1aa56c4eb30cd41a67002400d84b1289f09c0a6b276b416c3
    environment:
      # Flowise talks to Ollama over the internal network.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      # Optional basic auth credentials.
      FLOWISE_USERNAME: ${FLOWISE_USERNAME:-}
      FLOWISE_PASSWORD: ${FLOWISE_PASSWORD:-}
      # Serve Flowise under a path on the reverse proxy.
      FLOWISE_BASE_PATH: ${FLOWISE_BASE_PATH:-/}
    volumes:
      # Persist Flowise DB, chatflows, credentials, and uploads on host.
      # For macOS, set FLOWISE_DATA_MOUNT=flowise_data in env overrides.
      - ${FLOWISE_DATA_MOUNT:-${LLMSTACK_HOST_ROOT:-C:/llm-stack}/flowise/data}:/root/.flowise
      # For macOS, set PDF_DROP_MOUNT=../data/pdfs in env overrides.
      - ${PDF_DROP_MOUNT:-${LLMSTACK_HOST_ROOT:-C:/llm-stack}/pdfs}:/data/pdfs
    networks:
      - llm-stack
    depends_on:
      - ollama
    expose:
      # Internal-only port; reverse proxy publishes it.
      - "3000"

  pdf-auto-ingest:
    image: alpine@sha256:a4f4213abb84c497377b8544c81b3564f313746700372ec4fe84653e4fb03805
    environment:
      FLOWISE_URL: ${FLOWISE_URL:-http://flowise:3000}
      FLOWISE_INGEST_CHATFLOW_ID: ${FLOWISE_INGEST_CHATFLOW_ID:-f2f4fce2-9c7d-4ca6-8fd7-6c4b0c97f111}
      FLOWISE_INGEST_STOP_NODE_ID: ${FLOWISE_INGEST_STOP_NODE_ID:-qdrant_0}
      PDF_WATCH_DIR: /data/pdfs
    volumes:
      # Watch host drop folder directly.
      - ${PDF_DROP_MOUNT:-${LLMSTACK_HOST_ROOT:-C:/llm-stack}/pdfs}:/data/pdfs
      - ./flowise/scripts:/scripts:ro
    command:
      - /bin/sh
      - /scripts/pdf-auto-ingest.sh
    networks:
      - llm-stack
    depends_on:
      - flowise
