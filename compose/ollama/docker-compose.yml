services:
  ollama:
    image: ollama/ollama@sha256:0ff452f6a4c3c5bb4ab063a1db190b261d5834741a519189ed5301d50e4434d1
    profiles:
      - container-ollama
    cpus: "${OLLAMA_CPUS:-6.0}"
    mem_limit: "${OLLAMA_MEM_LIMIT:-16g}"
    # Expose only on the internal network by default.
    expose:
      - "11434"
    volumes:
      # Persist downloaded models and blobs.
      - ${OLLAMA_DATA_MOUNT:-ollama_data}:/root/.ollama
    networks:
      - llm-stack
