############################################
# SECTION: File Overview
#
# What this part of the program does:
# Defines infrastructure settings for this part of the stack using Docker Compose YAML.
# It describes services, configuration, and how containers communicate.
#
# Why it exists:
# Keeping service definitions in versioned YAML makes local environments reproducible.
# This prevents manual setup drift and reduces onboarding errors for new users.
#
# What happens next:
# The sections below declare concrete service/runtime settings that Docker Compose
# reads to start, connect, and persist the containers for this component.
############################################

############################################
# SECTION: Service Catalog
#
# What this part of the program does:
# Lists all containerized services defined in this compose file.
#
# Why it exists:
# Compose reads this section to know which containers to create and run
# as part of this stack component.
#
# What happens next:
# Each service block below declares image/runtime settings, then optional
# network and storage sections connect services together.
############################################

services:

  ############################################
  # SECTION: Service - open-webui
  #
  # What this part of the program does:
  # Defines runtime settings for the "open-webui" container.
  #
  # Why it exists:
  # This service provides one concrete capability needed by the stack
  # (for example API, storage, UI, proxy, or worker behavior).
  #
  # What happens next:
  # The nested keys configure how this container starts, connects, and
  # persists data relative to other services.
  ############################################
  open-webui:
    image: openwebui/open-webui@sha256:bb3f0281554bf05a9d505ffb5a5f067ab53e13ac772eb4ea3077a92ddc64600e
    expose:
      # Only expose internally; reverse proxy handles public access.
      - "8080"
    environment:
      # Open WebUI should talk to Ollama through the internal network.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      # Dedicated PostgreSQL backend for Open WebUI app state and migrations.
      DATABASE_URL: ${OPENWEBUI_DATABASE_URL:?set OPENWEBUI_DATABASE_URL in your env file}
      # Keep account creation disabled in hardened mode.
      ENABLE_SIGNUP: "false"
      # OIDC SSO via Authelia.
      ENABLE_LOGIN_FORM: ${OPENWEBUI_ENABLE_LOGIN_FORM:-false}
      ENABLE_OAUTH_SIGNUP: ${OPENWEBUI_ENABLE_OAUTH_SIGNUP:-true}
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: ${OPENWEBUI_OAUTH_MERGE_ACCOUNTS_BY_EMAIL:-true}
      WEBUI_URL: ${OPENWEBUI_WEBUI_URL:-https://openwebui.llmstack.lan}
      OAUTH_CLIENT_ID: ${OPENWEBUI_OAUTH_CLIENT_ID:-open-webui}
      OAUTH_CLIENT_SECRET: ${OPENWEBUI_OAUTH_CLIENT_SECRET:?set OPENWEBUI_OAUTH_CLIENT_SECRET in your env file}
      OPENID_PROVIDER_URL: ${OPENWEBUI_OPENID_PROVIDER_URL:-https://llmstack.lan/authelia/.well-known/openid-configuration}
      OPENID_REDIRECT_URI: ${OPENWEBUI_OPENID_REDIRECT_URI:-https://openwebui.llmstack.lan/oauth/oidc/callback}
      OAUTH_PROVIDER_NAME: ${OPENWEBUI_OAUTH_PROVIDER_NAME:-Authelia}
      OAUTH_SCOPES: ${OPENWEBUI_OAUTH_SCOPES:-openid email profile}
      OAUTH_CODE_CHALLENGE_METHOD: ${OPENWEBUI_OAUTH_CODE_CHALLENGE_METHOD:-S256}
      SSL_CERT_FILE: /etc/ssl/certs/llmstack-dev.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/llmstack-dev.crt
      CURL_CA_BUNDLE: /etc/ssl/certs/llmstack-dev.crt
    volumes:
      # Persist Open WebUI users, chats, files, and settings.
      - ${OPENWEBUI_DATA_MOUNT:-openwebui_data}:/app/backend/data
      # Trust local reverse-proxy TLS certificate for internal OIDC calls.
      - ../config/tls/dev.crt:/etc/ssl/certs/llmstack-dev.crt:ro
    networks:
      - llm-stack
