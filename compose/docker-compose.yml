############################################
# SECTION: File Overview
#
# What this part of the program does:
# Defines infrastructure settings for this part of the stack using Docker Compose YAML.
# It describes services, configuration, and how containers communicate.
#
# Why it exists:
# Keeping service definitions in versioned YAML makes local environments reproducible.
# This prevents manual setup drift and reduces onboarding errors for new users.
#
# What happens next:
# The sections below declare concrete service/runtime settings that Docker Compose
# reads to start, connect, and persist the containers for this component.
############################################

name: llm-stack


############################################
# SECTION: Service Networks
#
# What this part of the program does:
# Declares Docker networks used for service-to-service communication.
#
# Why it exists:
# Networks isolate traffic and provide stable DNS-based container discovery
# without exposing every service directly to the host.
#
# What happens next:
# Service blocks reference these networks so containers can find each other
# securely by name.
############################################
networks:
  llm-stack:
    driver: bridge
    # Single shared network so containers can reach each other by service name.

############################################
# SECTION: Service Catalog
#
# What this part of the program does:
# Lists all containerized services defined in this compose file.
#
# Why it exists:
# Compose reads this section to know which containers to create and run
# as part of this stack component.
#
# What happens next:
# Each service block below declares image/runtime settings, then optional
# network and storage sections connect services together.
############################################

services:

  ############################################
  # SECTION: Service - python-toolbox
  #
  # What this part of the program does:
  # Defines runtime settings for the "python-toolbox" container.
  #
  # Why it exists:
  # This service provides one concrete capability needed by the stack
  # (for example API, storage, UI, proxy, or worker behavior).
  #
  # What happens next:
  # The nested keys configure how this container starts, connects, and
  # persists data relative to other services.
  ############################################
  python-toolbox:
    build:
      context: ../python-toolbox
      dockerfile: Dockerfile
    image: llmstack/python-toolbox:local
    command: ["sleep", "infinity"]
    volumes:
      # Bind mount for scripts and libraries you edit locally.
      - ../python-toolbox/app:/app
      - ../bin:/host-bin
    networks:
      - llm-stack


  ############################################
  # SECTION: Service - python-api
  #
  # What this part of the program does:
  # Defines runtime settings for the "python-api" container.
  #
  # Why it exists:
  # This service provides one concrete capability needed by the stack
  # (for example API, storage, UI, proxy, or worker behavior).
  #
  # What happens next:
  # The nested keys configure how this container starts, connects, and
  # persists data relative to other services.
  ############################################
  python-api:
    image: llmstack/python-toolbox:local
    command:
      - uvicorn
      - api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    expose:
      # Internal API endpoint for stack services (Node-RED/Flowise).
      - "8000"
    volumes:
      # Share the same code and scripts as the toolbox container.
      - ../python-toolbox/app:/app
      - ../bin:/host-bin
    networks:
      - llm-stack


############################################
# SECTION: Persistent Volumes
#
# What this part of the program does:
# Declares named Docker volumes used by services in this file.
#
# Why it exists:
# Volumes keep state (databases, config, caches, user data) across
# container recreation so restarts do not erase important data.
#
# What happens next:
# Services mount these volume names at runtime to read/write durable data.
############################################
volumes:
  # Named volumes keep data around between container restarts.
  ollama_data:
  openwebui_data:
  qdrant_data:
  postgres_data:
  redis_data:
  flowise_data:
  openhands_data:
  prometheus_data:
  grafana_data:
  forgejo_data:
  pgadmin_data:
  redisinsight_data:
  nodered_data:
  pdf_drop_data:
  # Removing a volume here or running `docker compose down -v` deletes its data.
