services:
  python-toolbox:
    build:
      context: ../python-toolbox
      dockerfile: Dockerfile
    image: llmstack/python-toolbox:local
    command:
      - uvicorn
      - api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    expose:
      - "8000"
    volumes:
      - ../python-toolbox/app:/app
      - ../bin:/host-bin
    networks:
      llm-stack:
        aliases:
          - python-toolbox
          - python-api

  node-red:
    image: nodered/node-red@sha256:cf2d5657f12faebffaf1cea10203f277a2445434dec6a997212080ec0080f6c5
    environment:
      NODE_RED_HOST: ${NODE_RED_HOST:-localhost}
      NODE_RED_PORT: ${NODE_RED_PORT:-1880}
      NODE_RED_ENABLE_SAFE_MODE: ${NODE_RED_ENABLE_SAFE_MODE:-false}
    volumes:
      - ${NODERED_DATA_MOUNT:-nodered_data}:/data
    networks:
      llm-stack:
        aliases:
          - node-red
    expose:
      - "1880"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1880/"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  openclaw:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    user: "0:0"
    command:
      - /bin/sh
      - -lc
      - |
        if [ ! -f /data/openclaw.json ]; then
          cp /config/openclaw.json /data/openclaw.json
        fi
        exec node dist/index.js gateway
    environment:
      OPENCLAW_CONFIG_PATH: /data/openclaw.json
      OPENCLAW_STATE_DIR: /data
    volumes:
      - ../config/openclaw/openclaw.json:/config/openclaw.json:ro
      - ${OPENCLAW_STATE_MOUNT:-openclaw_data}:/data
    networks:
      llm-stack:
        aliases:
          - openclaw
    expose:
      - "18789"
    restart: unless-stopped

  openhands:
    image: ${OPENHANDS_IMAGE:-docker.all-hands.dev/all-hands-ai/openhands:0.54}
    environment:
      OPENHANDS_BASE_PATH: ${OPENHANDS_BASE_PATH:-/openhands}
      SANDBOX_RUNTIME_CONTAINER_IMAGE: ${OPENHANDS_RUNTIME_IMAGE:-docker.all-hands.dev/all-hands-ai/runtime:0.54-nikolaik}
      SANDBOX_VOLUMES: ${OPENHANDS_SANDBOX_VOLUMES:-${OPENHANDS_REPOS_MOUNT:-../repos}:/workspace:rw}
      SANDBOX_ADDITIONAL_NETWORKS: ${OPENHANDS_SANDBOX_NETWORKS:-["llm-shared"]}
      OH_PERSISTENCE_DIR: /.openhands
      LLM_MODEL: ${OPENHANDS_LLM_MODEL:-}
      LLM_BASE_URL: ${OPENHANDS_LLM_BASE_URL:-}
      LLM_API_KEY: ${OPENHANDS_LLM_API_KEY:-}
      FORGEJO_BASE_URL: ${FORGEJO_BASE_URL:-http://forgejo:3000}
      FORGEJO_OWNER: ${FORGEJO_OWNER:-}
      FORGEJO_REPO: ${FORGEJO_REPO:-}
      FORGEJO_TOKEN: ${FORGEJO_TOKEN:-}
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
    volumes:
      - ${OPENHANDS_STATE_MOUNT:-openhands_data}:/.openhands
      - ${OPENHANDS_REPOS_MOUNT:-../repos}:/workspace
    networks:
      llm-stack:
        aliases:
          - openhands
    expose:
      - "3000"
    restart: unless-stopped

  pdf-auto-ingest:
    image: alpine@sha256:a4f4213abb84c497377b8544c81b3564f313746700372ec4fe84653e4fb03805
    environment:
      FLOWISE_URL: ${FLOWISE_URL:-http://flowise:3000}
      FLOWISE_INGEST_CHATFLOW_ID: ${FLOWISE_INGEST_CHATFLOW_ID:-f2f4fce2-9c7d-4ca6-8fd7-6c4b0c97f111}
      FLOWISE_INGEST_STOP_NODE_ID: ${FLOWISE_INGEST_STOP_NODE_ID:-qdrant_0}
      FLOWISE_API_KEY: ${FLOWISE_API_KEY:-}
      PDF_WATCH_DIR: /data/pdfs
    volumes:
      - ${PDF_DROP_MOUNT:-../data/pdfs}:/data/pdfs
      - ./core/flowise/scripts:/scripts:ro
    command:
      - /bin/sh
      - /scripts/pdf-auto-ingest.sh
    networks:
      - llm-stack
    restart: unless-stopped

  rag-pipeline:
    build:
      context: ..
      dockerfile: compose/lab/rag-pipeline/Dockerfile
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      RAG_COLLECTION: ${RAG_COLLECTION:-documents}
      RAG_EMBED_MODEL: ${RAG_EMBED_MODEL:-nomic-embed-text}
      RAG_VECTOR_SIZE: ${RAG_VECTOR_SIZE:-768}
      RAG_SOURCE_DIRS: ${RAG_SOURCE_DIRS:-/workspace/processed,/workspace/ingest}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-400}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-50}
    volumes:
      - ../workspace:/workspace
    networks:
      - llm-stack

  pdf-ingest:
    build:
      context: ..
      dockerfile: compose/lab/pdf-ingest/Dockerfile
    environment:
      INGEST_INPUT_DIR: /workspace/ingest
      INGEST_OUTPUT_DIR: /workspace/processed
    volumes:
      - ../workspace:/workspace
    networks:
      - llm-stack

  ocr:
    image: jitesoft/tesseract-ocr@sha256:dee7fa08797af4a07acb41a2c985ec6ce4e4121afa87dd12d361c040bc5334c1
    volumes:
      - ../workspace:/workspace
    networks:
      - llm-stack

  stt:
    image: ghcr.io/ggerganov/whisper.cpp:latest
    working_dir: /app
    environment:
      STT_MODEL_PATH: ${STT_MODEL_PATH:-/models/ggml-base.en.bin}
    volumes:
      - ../data/stt/models:/models
      - ../workspace:/workspace
    networks:
      - llm-stack

  tts:
    image: rhasspy/piper:latest
    entrypoint: ["piper"]
    environment:
      TTS_VOICE_MODEL: ${TTS_VOICE_MODEL:-/voices/en_US-amy-low.onnx}
    volumes:
      - ../data/tts/voices:/voices
      - ../workspace:/workspace
    networks:
      - llm-stack

networks:
  llm-stack:
    name: llm-shared
    external: true

volumes:
  openclaw_data:
    name: llm-stack_openclaw_data
    external: true
  openhands_data:
    name: llm-stack_openhands_data
    external: true
  nodered_data:
    name: llm-stack_nodered_data
    external: true
