services:
  python-toolbox:
    build:
      context: ../services/python-toolbox
      dockerfile: Dockerfile
    image: llmstack/python-toolbox:local
    command:
      - uvicorn
      - api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    expose:
      - "8000"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama-gateway:11434}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      RAG_COLLECTION: ${RAG_COLLECTION:-documents}
      RAG_EMBED_MODEL: ${RAG_EMBED_MODEL:-nomic-embed-text}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-400}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-50}
      PDF_INGEST_WATCHER_ENABLED: ${PDF_INGEST_WATCHER_ENABLED:-true}
      PDF_INGEST_WATCH_INTERVAL: ${PDF_INGEST_WATCH_INTERVAL:-3}
    volumes:
      - ../services/python-toolbox/app:/app
      - ../tools/bin:/host-bin
      - ../data:/data
    networks:
      llm-stack:
        aliases:
          - python-toolbox
          - python-api
      # Toolbox jobs intentionally use Ollama for embeddings/inference.
      ollama-access:
    restart: unless-stopped

  node-red:
    image: nodered/node-red@sha256:cf2d5657f12faebffaf1cea10203f277a2445434dec6a997212080ec0080f6c5
    environment:
      NODE_RED_HOST: ${NODE_RED_HOST:-localhost}
      NODE_RED_PORT: ${NODE_RED_PORT:-1880}
      NODE_RED_ENABLE_SAFE_MODE: ${NODE_RED_ENABLE_SAFE_MODE:-false}
    volumes:
      - ${NODERED_DATA_MOUNT:-nodered_data}:/data
    networks:
      llm-stack:
        aliases:
          - node-red
    expose:
      - "1880"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1880/"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  openclaw:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.3.11}
    user: "0:0"
    command:
      - /bin/sh
      - -lc
      - |
        install -m 600 /config/openclaw.json /data/openclaw.json
        mkdir -p /data/workspace-chat /data/workspace-main
        rm -rf /data/workspace-chat/.git /data/workspace-main/.git
        cp -Rn /config/workspace-chat/. /data/workspace-chat/
        cp -Rn /config/workspace-main/. /data/workspace-main/
        exec node dist/index.js gateway
    environment:
      OPENCLAW_CONFIG_PATH: /data/openclaw.json
      OPENCLAW_STATE_DIR: /data
    volumes:
      - ../config/openclaw/openclaw.json:/config/openclaw.json:ro
      - ../config/openclaw/workspace-chat:/config/workspace-chat:ro
      - ../config/openclaw/workspace-main:/config/workspace-main:ro
      - ${OPENCLAW_STATE_MOUNT:-openclaw_data}:/data
    networks:
      llm-stack:
        aliases:
          - openclaw
      ollama-access:
    expose:
      - "18789"
    restart: unless-stopped

  aider:
    image: ${AIDER_IMAGE:-paulgauthier/aider-full@sha256:ba4d51b3c846b89d0f261f88dd712b9ce62968d3844c73fe2b3353ae65b11ea4}
    working_dir: /workspace
    command:
      - --browser
      - --model
      - ${AIDER_MODEL:-ollama_chat/qwen2.5-coder:7b-instruct}
      - --chat-history-file
      - /app/.aider-data/chat-history.md
      - --input-history-file
      - /app/.aider-data/input-history
      - --llm-history-file
      - /app/.aider-data/llm-history.log
      - --restore-chat-history
      - --no-auto-commits
      - --no-dirty-commits
      - --subtree-only
    environment:
      OLLAMA_API_BASE: ${AIDER_OLLAMA_API_BASE:-http://ollama-gateway:11434}
      AIDER_ANALYTICS_DISABLE: "true"
      AIDER_CHECK_UPDATE: "false"
    volumes:
      - ..:/workspace
      - ../data/aider:/app/.aider-data
    networks:
      llm-stack:
        aliases:
          - aider
      ollama-access:
    expose:
      - "8501"
    restart: unless-stopped

  openhands:
    image: ${OPENHANDS_IMAGE:-docker.all-hands.dev/all-hands-ai/openhands:0.54}
    environment:
      OPENHANDS_BASE_PATH: ${OPENHANDS_BASE_PATH:-/openhands}
      SANDBOX_RUNTIME_CONTAINER_IMAGE: ${OPENHANDS_RUNTIME_IMAGE:-docker.all-hands.dev/all-hands-ai/runtime:0.54-nikolaik}
      SANDBOX_VOLUMES: ${OPENHANDS_SANDBOX_VOLUMES:-${OPENHANDS_REPOS_MOUNT:-../data/openhands-workspace}:/workspace:rw}
      SANDBOX_ADDITIONAL_NETWORKS: ${OPENHANDS_SANDBOX_NETWORKS:-["llm-shared"]}
      OH_PERSISTENCE_DIR: /.openhands
      LLM_MODEL: ${OPENHANDS_LLM_MODEL:-}
      LLM_BASE_URL: ${OPENHANDS_LLM_BASE_URL:-}
      LLM_API_KEY: ${OPENHANDS_LLM_API_KEY:-}
      FORGEJO_BASE_URL: ${FORGEJO_BASE_URL:-http://forgejo:3000}
      FORGEJO_OWNER: ${FORGEJO_OWNER:-}
      FORGEJO_REPO: ${FORGEJO_REPO:-}
      FORGEJO_TOKEN: ${FORGEJO_TOKEN:-}
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
    volumes:
      - ${OPENHANDS_STATE_MOUNT:-openhands_data}:/.openhands
      - ${OPENHANDS_REPOS_MOUNT:-../data/openhands-workspace}:/workspace
    networks:
      llm-stack:
        aliases:
          - openhands
    expose:
      - "3000"
    restart: unless-stopped

  pdf-auto-ingest:
    image: alpine@sha256:a4f4213abb84c497377b8544c81b3564f313746700372ec4fe84653e4fb03805
    environment:
      FLOWISE_URL: ${FLOWISE_URL:-http://flowise:3000}
      FLOWISE_INGEST_CHATFLOW_ID: ${FLOWISE_INGEST_CHATFLOW_ID:-f2f4fce2-9c7d-4ca6-8fd7-6c4b0c97f111}
      FLOWISE_INGEST_STOP_NODE_ID: ${FLOWISE_INGEST_STOP_NODE_ID:-qdrant_0}
      FLOWISE_API_KEY: ${FLOWISE_API_KEY:-}
      PDF_WATCH_DIR: /data/pdfs/ingest-dropzone
      PDF_PROCESSED_DIR: /data/pdfs/processed/original
      PDF_FAILED_DIR: /data/pdfs/failed
    volumes:
      - ${PDF_DROP_MOUNT:-../data/pdfs}:/data/pdfs
      - ./core/flowise/scripts:/scripts:ro
    command:
      - /bin/sh
      - /scripts/pdf-auto-ingest.sh
    networks:
      - llm-stack
    restart: unless-stopped

  rag-pipeline:
    build:
      context: ..
      dockerfile: compose/lab/rag-pipeline/Dockerfile
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama-gateway:11434}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      RAG_COLLECTION: ${RAG_COLLECTION:-documents}
      RAG_EMBED_MODEL: ${RAG_EMBED_MODEL:-nomic-embed-text}
      RAG_VECTOR_SIZE: ${RAG_VECTOR_SIZE:-768}
      RAG_SOURCE_DIRS: ${RAG_SOURCE_DIRS:-/data/pdfs/processed/rawtext}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-400}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-50}
    volumes:
      - ../data:/data
    networks:
      - llm-stack
      # Batch embedding/indexing job intentionally uses Ollama.
      - ollama-access

  pdf-ingest:
    build:
      context: ..
      dockerfile: compose/lab/pdf-ingest/Dockerfile
    environment:
      INGEST_INPUT_DIR: /data/pdfs/ingest-dropzone
      INGEST_OUTPUT_DIR: /data/pdfs/processed
    volumes:
      - ../data:/data
    networks:
      - llm-stack

  ocr:
    image: jitesoft/tesseract-ocr@sha256:dee7fa08797af4a07acb41a2c985ec6ce4e4121afa87dd12d361c040bc5334c1
    volumes:
      - ../data:/data
    networks:
      - llm-stack

  stt:
    image: ghcr.io/ggerganov/whisper.cpp:latest
    working_dir: /app
    environment:
      STT_MODEL_PATH: ${STT_MODEL_PATH:-/models/ggml-base.en.bin}
    volumes:
      - ../data/stt/models:/models
      - ../data:/data
    networks:
      - llm-stack

  tts:
    image: rhasspy/piper:latest
    entrypoint: ["piper"]
    environment:
      TTS_VOICE_MODEL: ${TTS_VOICE_MODEL:-/voices/en_US-amy-low.onnx}
    volumes:
      - ../data/tts/voices:/voices
      - ../data:/data
    networks:
      - llm-stack

networks:
  llm-stack:
    name: llm-shared
    external: true
  ollama-access:
    name: llm-ollama-access
    external: true

volumes:
  openclaw_data:
    name: llm-stack_openclaw_data
    external: true
  openhands_data:
    name: llm-stack_openhands_data
    external: true
  nodered_data:
    name: llm-stack_nodered_data
    external: true
